<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="320" viewBox="0 0 1400 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070707"/>
      <stop offset="0.58" stop-color="#111111"/>
      <stop offset="1" stop-color="#260000"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e0000"/>
      <stop offset="0.5" stop-color="#ff3b3b"/>
      <stop offset="1" stop-color="#5e0000"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1400" height="320" rx="20" fill="url(#grid)"/>

  <rect x="58" y="58" width="7" height="132" fill="#ff3b3b" filter="url(#glow)"/>
  <rect x="82" y="63" width="3" height="122" fill="#5e0000"/>

  <g transform="translate(108 0) scale(1.16 1)">
    <text x="0" y="135"
      fill="#eeeeee"
      font-family="Arial, Helvetica, sans-serif"
      font-size="62"
      font-weight="800"
      letter-spacing="7">
      ANDROID-FIRST SYSTEMS
    </text>
  </g>

  <text x="112" y="184"
    fill="#ff4a4a"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    font-weight="700"
    letter-spacing="6">
    AGENTS // AUTOMATION // SECURITY // LOCAL AI
  </text>

  <line x1="112" y1="216" x2="1288" y2="216" stroke="url(#red)" stroke-width="2"/>
  <circle cx="112" cy="216" r="4" fill="#ff3b3b"/>
  <circle cx="1288" cy="216" r="4" fill="#ff3b3b"/>

  <text x="112" y="260"
    fill="#8f8f8f"
    font-family="Arial, Helvetica, sans-serif"
    font-size="16"
    letter-spacing="2.5">
    BUILD THINGS THAT DO THE BORING PART THEMSELVES.
  </text>

  <text x="112" y="287"
    fill="#565656"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    letter-spacing="1.7">
    IF IT STILL NEEDS SIX CLICKS EVERY TUESDAY, IT IS NOT AUTOMATION YET.
  </text>
</svg>