<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="320" viewBox="0 0 1400 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.60" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#260000"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.46" stop-color="#d8d8d8"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d0000"/>
      <stop offset="0.5" stop-color="#ff3030"/>
      <stop offset="1" stop-color="#4d0000"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#ffffff" stroke-opacity=".032" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1400" height="320" rx="18" fill="url(#grid)"/>

  <g opacity=".30" stroke="#ff3030" stroke-width="1">
    <path d="M1030 30H1322M1105 52H1360M36 244H310"/>
    <path d="M1282 18V112M1186 220V304M380 20V86"/>
  </g>

  <rect x="55" y="53" width="10" height="148" fill="#ff3030" filter="url(#glow)"/>
  <rect x="76" y="60" width="3" height="134" fill="#970000"/>
  <rect x="94" y="72" width="2" height="112" fill="#3e0000"/>

  <text x="112" y="142"
    fill="url(#metal)"
    font-family="'Eurostile Extended','Microgramma D Extended','Bank Gothic','Arial Black',sans-serif"
    font-size="74"
    font-weight="900"
    letter-spacing="2"
    textLength="1172"
    lengthAdjust="spacingAndGlyphs">
    ANDROID-FIRST SYSTEMS
  </text>

  <text x="114" y="192"
    fill="#ff3030"
    font-family="'Eurostile Extended','Microgramma D Extended','Bank Gothic','Arial Black',sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="4"
    textLength="980"
    lengthAdjust="spacingAndGlyphs">
    AGENTS // AUTOMATION // SECURITY // LOCAL AI
  </text>

  <line x1="114" y1="224" x2="1290" y2="224" stroke="url(#red)" stroke-width="1.4"/>
  <circle cx="114" cy="224" r="3.5" fill="#ff3030"/>
  <circle cx="1290" cy="224" r="3.5" fill="#ff3030"/>

  <text x="114" y="263"
    fill="#a4a4a4"
    font-family="'Eurostile Extended','Bank Gothic','Arial',sans-serif"
    font-size="14"
    letter-spacing="3.4">
    BUILD THINGS THAT DO THE BORING PART THEMSELVES.
  </text>

  <text x="114" y="289"
    fill="#626262"
    font-family="'Eurostile Extended','Bank Gothic','Arial',sans-serif"
    font-size="11.5"
    letter-spacing="2.1">
    IF IT STILL NEEDS SIX CLICKS EVERY TUESDAY, IT IS NOT AUTOMATION YET.
  </text>
</svg>