<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="t d">
<title id="t">LEVOMM / NEON TERMINAL</title><desc id="d">Cyber terminal showing LEVOMM, Android-first agents, automation, Linux and security in neon green on black.</desc>
<defs>
  <radialGradient id="bg" cx=".67" cy=".36" r="1"><stop offset="0" stop-color="#102819"/><stop offset=".46" stop-color="#07130d"/><stop offset="1" stop-color="#010503"/></radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#256d35"/><stop offset=".5" stop-color="#73ff82"/><stop offset="1" stop-color="#1e6332"/></linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4cff70" stop-opacity=".14"/><stop offset="1" stop-color="#4cff70" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#48ff72" stroke-width=".65" opacity=".11"/></pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".23"/></pattern>
  <filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
  <clipPath id="screen"><rect x="4" y="4" width="1392" height="512" rx="15"/></clipPath>
</defs>
<style>
  .mono{font-family:'JetBrains Mono','IBM Plex Mono',Consolas,'Courier New',monospace}
  .bright{fill:#a4ffb0}.green{fill:#52ff78}.dim{fill:#69ad7b}.muted{fill:#396b4b}
  .cursor{animation:blink 1.15s steps(1,end) infinite}.pulse{animation:blink 3.5s ease-in-out infinite}
  @keyframes blink{0%,48%{opacity:1}50%,99%{opacity:.18}100%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.cursor,.pulse{animation:none}}
</style>
