name: Refresh profile contribution calendar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-contributions.yml"
      - "scripts/update_contributions.py"
  schedule:
    - cron: "27 1 * * *"

permissions:
  contents: write

concurrency:
  group: levomm-contribution-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch verified GitHub activity and render SVG
        env:
          GH_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN || github.token }}
        run: python scripts/update_contributions.py

      - name: Commit updated chart only when data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-2026.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(profile): update verified 2026 contribution calendar"
            git push
          fi
